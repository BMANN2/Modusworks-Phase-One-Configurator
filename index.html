<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Modusworks Phase One Configurator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{
    margin:0;
    background:#1f1f1f;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    margin-top:20px;
    margin-bottom:0;
    text-align:center;
}

#captureArea{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px 20px;
}

#ring{
    position:relative;
    width:650px;
    height:650px;
    margin-top:20px;
}

svg{
    position:absolute;
    left:0;
    top:0;
}

.slot{
    position:absolute;
    width:46px;
    height:46px;
    border-radius:50%;
    border:3px solid white;
    cursor:pointer;
    transition:.2s;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    font-size:16px;
    user-select:none;
    box-sizing:border-box;
    z-index:2;
}

.slot:hover{
    transform:scale(1.12);
}

.spacer{
    background:#777;
}

.plus{
    background:#28c840;
}

.minus{
    background:#d93b3b;
}

.lockToggle{
    position:absolute;
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid white;
    cursor:pointer;
    transition:.2s;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    font-size:9px;
    user-select:none;
    box-sizing:border-box;
    z-index:1;
}

.lockToggle:hover{
    transform:scale(1.2);
}

.tight{
    background:#2d8cff;
}

.loose{
    background:#e0a020;
}

.fixedMagnet{
    position:absolute;
    width:50px;
    height:50px;
    border-radius:50%;
    background:#bbbbbb;
    border:3px solid white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    font-size:10px;
    color:#222;
    box-sizing:border-box;
    text-align:center;
    line-height:1.1;
}

#stats{
    margin-top:20px;
    font-size:18px;
    display:flex;
    gap:25px;
    flex-wrap:wrap;
    justify-content:center;
}

#configSection{
    margin-top:35px;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width:500px;
}

#configSection label{
    font-size:16px;
    margin-bottom:8px;
}

#configText{
    width:100%;
    box-sizing:border-box;
    padding:10px 12px;
    font-size:16px;
    font-family:"Courier New",monospace;
    letter-spacing:1px;
    text-align:center;
    border-radius:8px;
    border:2px solid #555;
    background:#2b2b2b;
    color:white;
}

#configText:focus{
    outline:none;
    border-color:#2d8cff;
}

#configHint{
    margin-top:8px;
    font-size:12px;
    color:#aaa;
    text-align:center;
}

#shareButton{
    margin-top:30px;
    margin-bottom:40px;
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#2d8cff;
    color:white;
    transition:.2s;
}

#shareButton:hover{
    background:#4fa0ff;
    transform:scale(1.05);
}
</style>

</head>
<body>

<div id="captureArea">

<h1>Modusworks Phase One Configurator</h1>

<div id="ring">

<svg width="650" height="650">
    <circle
        cx="325"
        cy="325"
        r="180"
        fill="none"
        stroke="#555"
        stroke-width="80"/>
</svg>

</div>

<div id="stats">
    <div>⚪ Spacer: <span id="spacerCount">12</span></div>
    <div>🟢 Attract (+): <span id="plusCount">0</span></div>
    <div>🔴 Repel (−): <span id="minusCount">0</span></div>
    <div>🔩 Tight: <span id="tightCount">6</span></div>
    <div>🔩 Loose: <span id="looseCount">0</span></div>
</div>

</div>

<div id="configSection">
    <label for="configText">Configuration Code (copy to share, or paste one to load)</label>
    <input type="text" id="configText" spellcheck="false" autocomplete="off">
    <div id="configHint">Format: 6 arms from center-out, top arm first, going clockwise — e.g. SAT-SAT-SAT-SAT-SAT-SAT</div>
</div>

<button id="shareButton">
📸 Share Configuration!
</button>

<script>

const ring=document.getElementById("ring");

const center=325;

const slotRadiusInner=155;
const slotRadiusOuter=205;

const lockOffset=32; // how far the tight/loose toggle sits from its outer slot, radially outward

const typeStates=[
    {
        cls:"spacer",
        text:"",
        code:"S"
    },
    {
        cls:"plus",
        text:"+",
        code:"A"
    },
    {
        cls:"minus",
        text:"−",
        code:"R"
    }
];

const lockStates=[
    {
        cls:"tight",
        text:"T",
        code:"T"
    },
    {
        cls:"loose",
        text:"L",
        code:"L"
    }
];

let arms=[]; // one entry per arm: {innerDiv, outerDiv, lockDiv}

for(let i=0;i<6;i++){

    // i=0 starts at the top (-90deg) and increasing i rotates clockwise
    const angle=(Math.PI/3)*i-Math.PI/2;

    let armEntry={innerDiv:null,outerDiv:null,lockDiv:null};

    [
        {radius:slotRadiusInner,isOuter:false},
        {radius:slotRadiusOuter,isOuter:true}
    ].forEach(cfg=>{

        const radius=cfg.radius;

        const x=center+Math.cos(angle)*radius-23;
        const y=center+Math.sin(angle)*radius-23;

        const div=document.createElement("div");

        div.className="slot spacer";
        div.dataset.state=0;

        div.style.left=x+"px";
        div.style.top=y+"px";

        div.onclick=function(){

            let state=(parseInt(div.dataset.state)+1)%3;

            div.dataset.state=state;

            div.className="slot "+typeStates[state].cls;
            div.textContent=typeStates[state].text;

            updateCounts();
            updateConfigText();

        };

        ring.appendChild(div);

        if(cfg.isOuter){
            armEntry.outerDiv=div;
        }else{
            armEntry.innerDiv=div;
        }

        // --- only outer-ring slots get a tight/loose toggle ---

        if(cfg.isOuter){

            const lockRadius=radius+lockOffset;

            const lx=center+Math.cos(angle)*lockRadius-10;
            const ly=center+Math.sin(angle)*lockRadius-10;

            const lockDiv=document.createElement("div");

            lockDiv.className="lockToggle tight";
            lockDiv.dataset.state=0;

            lockDiv.style.left=lx+"px";
            lockDiv.style.top=ly+"px";
            lockDiv.textContent=lockStates[0].text;

            lockDiv.onclick=function(){

                let state=(parseInt(lockDiv.dataset.state)+1)%2;

                lockDiv.dataset.state=state;

                lockDiv.className="lockToggle "+lockStates[state].cls;
                lockDiv.textContent=lockStates[state].text;

                updateCounts();
                updateConfigText();

            };

            ring.appendChild(lockDiv);

            armEntry.lockDiv=lockDiv;

        }

    });

    arms.push(armEntry);

}

function updateCounts(){

    let spacer=0;
    let plus=0;
    let minus=0;
    let tight=0;
    let loose=0;

    arms.forEach(arm=>{

        [arm.innerDiv,arm.outerDiv].forEach(div=>{

            switch(parseInt(div.dataset.state)){
                case 0:
                    spacer++;
                    break;

                case 1:
                    plus++;
                    break;

                case 2:
                    minus++;
                    break;
            }

        });

        if(parseInt(arm.lockDiv.dataset.state)===0){
            tight++;
        }else{
            loose++;
        }

    });

    document.getElementById("spacerCount").textContent=spacer;
    document.getElementById("plusCount").textContent=plus;
    document.getElementById("minusCount").textContent=minus;
    document.getElementById("tightCount").textContent=tight;
    document.getElementById("looseCount").textContent=loose;

}

updateCounts();

// --- Fixed magnet (static, non-interactive) ---

const fixedMagnetOffsetUp=70; // how far above dead-center it sits

const fixedX=center-25;
const fixedY=center-fixedMagnetOffsetUp-25;

const fixedDiv=document.createElement("div");

fixedDiv.className="fixedMagnet";
fixedDiv.style.left=fixedX+"px";
fixedDiv.style.top=fixedY+"px";
fixedDiv.textContent="Fixed Magnet";

ring.appendChild(fixedDiv);

// --- Config code string: 6 arms, top first, clockwise, each "InnerOuterLock" ---
// e.g. spacer/repel/loose arm -> "SRL". Arms joined with "-".

function buildConfigString(){

    return arms.map(arm=>{

        const innerCode=typeStates[parseInt(arm.innerDiv.dataset.state)].code;
        const outerCode=typeStates[parseInt(arm.outerDiv.dataset.state)].code;
        const lockCode=lockStates[parseInt(arm.lockDiv.dataset.state)].code;

        return innerCode+outerCode+lockCode;

    }).join("-");

}

function updateConfigText(){

    document.getElementById("configText").value=buildConfigString();

}

updateConfigText();

// --- Parse a pasted config string and apply it to the ring ---

const configPattern=/^[SAR][SAR][TL](-[SAR][SAR][TL]){5}$/;

const typeCodeToState={S:0,A:1,R:2};
const lockCodeToState={T:0,L:1};

function applyConfigString(str){

    const cleaned=str.trim().toUpperCase();

    if(!configPattern.test(cleaned)){
        return false;
    }

    const groups=cleaned.split("-");

    groups.forEach((group,i)=>{

        const arm=arms[i];

        const innerState=typeCodeToState[group[0]];
        const outerState=typeCodeToState[group[1]];
        const lockState=lockCodeToState[group[2]];

        arm.innerDiv.dataset.state=innerState;
        arm.innerDiv.className="slot "+typeStates[innerState].cls;
        arm.innerDiv.textContent=typeStates[innerState].text;

        arm.outerDiv.dataset.state=outerState;
        arm.outerDiv.className="slot "+typeStates[outerState].cls;
        arm.outerDiv.textContent=typeStates[outerState].text;

        arm.lockDiv.dataset.state=lockState;
        arm.lockDiv.className="lockToggle "+lockStates[lockState].cls;
        arm.lockDiv.textContent=lockStates[lockState].text;

    });

    updateCounts();

    return true;

}

document.getElementById("configText").addEventListener("input",function(){

    applyConfigString(this.value);

});

// --- Screenshot ---

document.getElementById("shareButton").onclick = async function(){

    this.style.visibility="hidden";

    const canvas=await html2canvas(document.getElementById("captureArea"),{
        backgroundColor:"#1f1f1f",
        scale:2
    });

    this.style.visibility="visible";

    const link=document.createElement("a");

    link.download=buildConfigString()+".png";
    link.href=canvas.toDataURL("image/png");
    link.click();

};

</script>

</body>
</html>
